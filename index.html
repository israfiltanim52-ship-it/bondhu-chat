<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1769e0">
  <meta name="description" content="Bondhu Chat — সহজ টেক্সট মেসেজিং">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <title>বন্ধু চ্যাট</title>
</head>

<body>
  <header>
    <div class="brand">
      <span class="logo">ব</span>
      <div>
        <strong>বন্ধু চ্যাট</strong>
        <small>Bondhu Chat</small>
      </div>
    </div>
    <button id="logoutBtn" class="ghost hidden" type="button">লগআউট</button>
  </header>

  <main>
    <section id="setupNotice" class="notice">
      প্রথমে <code>app.js</code> ফাইলে Firebase কনফিগারেশন বসান।
    </section>

    <!-- Login and registration -->
    <section id="authView" class="panel">
      <h2>ইমেইল দিয়ে লগইন</h2>

      <label for="emailInput">ইমেইল</label>
      <input
        id="emailInput"
        type="email"
        placeholder="আপনার ইমেইল লিখুন"
        autocomplete="email"
      >

      <label for="passwordInput">পাসওয়ার্ড</label>
      <input
        id="passwordInput"
        type="password"
        placeholder="পাসওয়ার্ড লিখুন"
        autocomplete="current-password"
      >

      <button id="emailLoginBtn" class="primary" type="button">
        লগইন
      </button>

      <button id="emailRegisterBtn" class="ghost" type="button">
        নতুন অ্যাকাউন্ট খুলুন
      </button>

      <p id="authMsg" class="message" aria-live="polite"></p>
    </section>

    <!-- Main application -->
    <section id="appView" class="hidden">

      <div class="panel profileRow">
        <img id="myPhoto" class="avatar" alt="আমার ছবি">
        <div class="grow">
          <strong id="myName"></strong>
          <small id="myPhone"></small>
        </div>
        <span class="onlineDot"></span>
      </div>

      <section class="panel">
        <h2>বন্ধুকে খুঁজুন</h2>
        <p class="muted">বন্ধুর দেশ কোডসহ ফোন নম্বর লিখুন।</p>

        <div class="searchRow">
          <input
            id="friendPhone"
            inputmode="tel"
            placeholder="+8801XXXXXXXXX"
          >
          <button id="findBtn" class="primary" type="button">খুঁজুন</button>
        </div>

        <p id="findMsg" class="message" aria-live="polite"></p>
        <div id="foundFriend"></div>
      </section>

      <section class="panel">
        <h2>সাম্প্রতিক চ্যাট</h2>
        <div id="chatList">
          <p class="muted">এখনো কোনো চ্যাট নেই।</p>
        </div>
      </section>

      <section id="chatPanel" class="panel hidden">
        <div class="chatHeading">
          <button id="backBtn" class="ghost" type="button">←</button>
          <img id="friendPhoto" class="avatar small" alt="বন্ধুর ছবি">
          <div class="grow">
            <strong id="friendName"></strong>
            <small id="friendStatus">চ্যাট</small>
          </div>
        </div>

        <div id="messages" class="messages"></div>

        <form id="sendForm" class="sendRow">
          <input
            id="messageInput"
            maxlength="2000"
            placeholder="মেসেজ লিখুন…"
            autocomplete="off"
          >
          <button class="primary" type="submit">পাঠান</button>
        </form>

        <p id="sendMsg" class="message"></p>
      </section>

    </section>
  </main>

  <footer>বন্ধু চ্যাট · শুধু টেক্সট মেসেজ</footer>

  <div class="developer-credit" style="text-align:center;padding:16px;color:#1769e0;">
    নির্মাতা: <strong>ইস্রাফিল তানিম</strong><br>
    Developer: Israfil Tanim
  </div>

  <script type="module" src="./app.js"></script>
</body>
        </html>
