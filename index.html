
<!-- Authentication -->
<div id="authView">
  <div class="auth-container">
    <div class="auth-hero">
      <div class="auth-logo">BC</div>
      <div class="eyebrow">WELCOME TO</div>
      <h2>Bondhu <span>Chat</span></h2>
      <p data-i18n="authIntro"></p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" id="loginMode" class="active">লগইন</button>
        <button type="button" id="signupMode">নতুন অ্যাকাউন্ট</button>
      </div>

      <form id="authForm">
        <label id="nameLabel" class="hidden">আপনার নাম</label>
        <input id="displayName" class="hidden" placeholder="আপনার নাম">

        <label>ইমেইল</label>
        <input id="email" type="email" required placeholder="name@example.com">

        <label>পাসওয়ার্ড</label>
        <input id="password" type="password" required placeholder="কমপক্ষে ৬ অক্ষর">

        <button id="authSubmit" type="submit">লগইন</button>
        <button id="resetPassword" type="button">পাসওয়ার্ড ভুলে গেছেন?</button>
        <p id="authMessage"></p>
      </form>
    </div>
  </div>
</div>
